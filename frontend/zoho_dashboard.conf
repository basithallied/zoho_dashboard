# -------------------------------------------------------------
# Apache VirtualHost Configuration for Bare-Metal Deployment
# Systemd + Apache2 + Cloudflare Flexible SSL
#
# Cloudflare Flexible mode:
#   Visitor <--> Cloudflare : HTTPS (Cloudflare handles SSL)
#   Cloudflare <--> This Server : HTTP on port 80 (no cert needed here)
#
# Replace "dashboard.yourcompany.com" with your actual domain.
# -------------------------------------------------------------

<VirtualHost *:80>
    ServerName dashboard.yourcompany.com
    DocumentRoot /var/www/zoho_dashboard/frontend/dist

    # React HTML5 Single Page Application (SPA) Routing
    <Directory /var/www/zoho_dashboard/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Apache Reverse Proxy to Gunicorn / Uvicorn FastAPI Backend
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    # Tell the app that the original request came over HTTPS
    # (Cloudflare sends X-Forwarded-Proto: https for Flexible)
    RequestHeader set X-Forwarded-Proto "https"

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/zoho_mis_error.log
    CustomLog ${APACHE_LOG_DIR}/zoho_mis_access.log combined
</VirtualHost>
